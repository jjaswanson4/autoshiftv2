# Non-HA ACP Spoke Cluster Sets — custom config examples.
#
# Shows how to use config blocks to deliver custom operand specs for ODF
# and cert-manager.  The config section is merged into the per-cluster
# rendered-config ConfigMap on the hub; policy templates consume it via
# hub template lookups.
#
# Operators whose templates read from rendered-config:
#   - ODF StorageCluster  (config.odf.storageCluster)
#   - Local Storage        (config.localStorage.{localVolumeDiscovery,localVolumeSets})
#   - AAP                 (config.aap.instance)
#   - cert-manager        (config.certManager.{ca,apiCert,ingressCert})
#   - Workload Partitioning (config.workloadPartitioning.performanceProfile)
#   - NMState             (config.networking)
#   - UWM                 (config.uwm)
managedClusterSets:
  non-ha-acps:
    config:
      # ── cert-manager — issuer refs + SANs ─────────────────────────────
      # Enable flags are labels below (cert-manager, cert-manager-ca, etc.).
      # The config block controls WHAT issuers/SANs the certs use.
      certManager:
        ca:
          issuer:
            name: 'autoshift-selfsigned'
            kind: 'ClusterIssuer'
            group: 'cert-manager.io'
        apiCert:
          issuer:
            name: 'autoshift-ca'
            kind: 'ClusterIssuer'
            group: 'cert-manager.io'
          extraSANs: []
        ingressCert:
          issuer:
            name: 'autoshift-ca'
            kind: 'ClusterIssuer'
            group: 'cert-manager.io'
          extraSANs: []
      # ── AAP instance overrides ──────────────────────────────────────
      # Everything under config.aap.instance maps 1-to-1 with the
      # AnsibleAutomationPlatform CR spec.  When present, it replaces the
      # default label-driven spec entirely.
      # aap:
      #   instance:
      #     controller:
      #       disabled: false
      #     hub:
      #       disabled: false
      #       storage_type: S3
      #       object_storage_s3_secret: s3-aap-odf
      #     eda:
      #       disabled: false
      #     lightspeed:
      #       disabled: true
      #     redis_mode: standalone
      #     bundle_cacert_secret: user-ca-bundle
      # ── ODF StorageCluster overrides ──────────────────────────────────
      # Everything under config.odf.storageCluster maps 1-to-1 with the
      # StorageCluster CR spec.  When present, it replaces the default
      # label-driven spec entirely.
      odf:
        storageCluster:
          enableCephTools: true
          manageNodes: false
          failureDomain: host
          failureDomainKey: kubernetes.io/hostname
          performanceProfile: Lean
          managedResources:
            cephBlockPools:
              reconcileStrategy: ignore
          storageDeviceSets:
            - name: nvme-set
              deviceClass: nvme
              count: 1
              replica: 3
              placement: {}
              dataPVCTemplate:
                spec:
                  storageClassName: local-nvme
                  accessModes:
                    - ReadWriteOnce
                  volumeMode: Block
                  resources:
                    requests:
                      storage: 1
              resources:
                limits:
                  cpu: "2"
                  memory: 4Gi
                requests:
                  cpu: "1"
                  memory: 2Gi
            - name: ssd-set
              deviceClass: ssd
              count: 1
              replica: 3
              placement: {}
              dataPVCTemplate:
                spec:
                  storageClassName: local-ssd
                  accessModes:
                    - ReadWriteOnce
                  volumeMode: Block
                  resources:
                    requests:
                      storage: 1
              resources:
                limits:
                  cpu: "2"
                  memory: 4Gi
                requests:
                  cpu: "1"
                  memory: 2Gi
      # ── Local Storage overrides ─────────────────────────────────────
      # localVolumeDiscovery: creates a LocalVolumeDiscovery CR (optional).
      # localVolumeSets: dict keyed by name; each entry becomes a
      #   LocalVolumeSet CR named "<key>-localvolumeset".
      # When localVolumeSets is absent, the default hardcoded
      # nvme-localvolumeset (disks >= 200G on OCS nodes) is created.
      localStorage:
        localVolumeDiscovery:
          nodeSelector:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: cluster.ocs.openshift.io/openshift-storage
                    operator: Exists
          tolerations:
            - effect: NoSchedule
              key: node.ocs.openshift.io/storage
              operator: Exists
        localVolumeSets:
          nvme:
            storageClassName: local-nvme
            volumeMode: Block
            deviceInclusionSpec:
              deviceTypes:
                - disk
              deviceMechanicalProperties:
                - NonRotational
              minSize: 200G
            nodeSelector:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: cluster.ocs.openshift.io/openshift-storage
                      operator: Exists
            tolerations:
              - effect: NoSchedule
                key: node.ocs.openshift.io/storage
                operator: Exists
          ssd:
            storageClassName: local-ssd
            volumeMode: Block
            deviceInclusionSpec:
              deviceTypes:
                - disk
              deviceMechanicalProperties:
                - Rotational
              minSize: 100G
            nodeSelector:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: cluster.ocs.openshift.io/openshift-storage
                      operator: Exists
            tolerations:
              - effect: NoSchedule
                key: node.ocs.openshift.io/storage
                operator: Exists
      # ── Workload Partitioning / PerformanceProfile ────────────────────
      # When performanceProfile is present, the full name/annotations/spec
      # are used as-is.  When absent, the existing field-by-field config
      # (reservedCpus, isolatedCpus, nodeSelector, etc.) still works.
      # workloadPartitioning:
      #   performanceProfile:
      #     name: controlplane-performanceprofile
      #     annotations:
      #       kubeletconfig.experimental: |
      #         {"podsPerCore": 0, "maxPods": 500, "systemReserved": {"memory": "2Gi"}}
      #     spec:
      #       cpu:
      #         isolated: "4-32,36-45,47-63"
      #         reserved: "0-3,33-35,46"
      #       machineConfigPoolSelector:
      #         pools.operator.machineconfiguration.openshift.io/master: ""
      #       nodeSelector:
      #         node-role.kubernetes.io/master: ''
      #       numa:
      #         topologyPolicy: "restricted"
      #       realTimeKernel:
      #         enabled: false
      #       workloadHints:
      #         realTime: false
      #         highPowerConsumption: false
      #         perPodPowerManagement: false
      # ── UWM example (commented) ──────────────────────────────────────
      # uwm:
      #   prometheus:
      #     retention: '24h'
      #     storage: '50Gi'
      #   thanosRuler:
      #     retention: '24h'
      #     storage: '10Gi'
      #   alertmanager:
      #     enabled: false
      #     storage: '10Gi'
    labels:
      # OpenShift version for cluster deployment and image mirroring
      openshift-version: '4.22.6'
      ### tempo
      # tempo: 'true'
      tempo-subscription-name: tempo-product
      tempo-channel: stable
      tempo-source: redhat-operators
      tempo-source-namespace: openshift-marketplace
      ### kiali
      # kiali: 'true'
      kiali-subscription-name: kiali-ossm
      kiali-channel: stable
      kiali-source: redhat-operators
      kiali-source-namespace: openshift-marketplace
      kiali-version: 'kiali-operator.v2.17.2'
      ### servicemesh3
      # servicemesh3operator: 'true'
      servicemesh3operator-subscription-name: servicemeshoperator3
      servicemesh3operator-channel: stable
      servicemesh3operator-source: redhat-operators
      servicemesh3operator-source-namespace: openshift-marketplace
      servicemesh3operator-version: 'servicemeshoperator3.v3.3.1'
      # servicemesh3-ambient: 'true'
      ### Master Node Kubelet Configuration
      # master-nodes: 'true'
      # master-max-pods: '250'
      # master-system-reserved-memory: '3Gi'
      # master-system-reserved-cpu: '500m'
      # master-kube-reserved-memory: '1536Mi'
      # master-kube-reserved-cpu: '500m'
      # master-eviction-memory: '500Mi'
      ### Infrastructure Nodes
      infra-nodes: ''
      infra-nodes-numcpu: ''
      infra-nodes-memory-mib: ''
      infra-nodes-numcores-per-socket: ''
      infra-nodes-zones: ''
      infra-machineconfigpool: 'false'
      infra-node-config: 'false'
      ### Worker Nodes
      worker-nodes: ''
      worker-nodes-numcpu: ''
      worker-nodes-memory-mib: ''
      worker-nodes-numcores-per-socket: ''
      worker-nodes-zones: ''
      worker-node-config: 'false'
      ### Storage Nodes
      storage-nodes: ''
      storage-nodes-numcpu: ''
      storage-nodes-memory-mib: ''
      storage-nodes-numcores-per-socket: ''
      storage-nodes-zones: ''
      ### Local Storage Operator
      local-storage: 'true'
      local-storage-subscription-name: local-storage-operator
      local-storage-channel: stable
      local-storage-source: redhat-operators
      local-storage-source-namespace: openshift-marketplace
      ### LVM Operator
      lvm: 'true'
      lvm-channel: stable-4.22
      lvm-source: redhat-operators
      lvm-source-namespace: openshift-marketplace
      lvm-subscription-name: lvms-operator
      lvm-default: 'true'
      lvm-fstype: xfs
      lvm-size-percent: '90'
      lvm-overprovision-ratio: '10'
      ### OpenShift Data Foundation
      odf: 'true'
      odf-subscription-name: odf-operator
      odf-multi-cloud-gateway: standard
      odf-noobaa-pvpool: ''
      odf-noobaa-store-size: ''
      odf-noobaa-store-num-volumes: ''
      # Label-driven ODF knobs still apply as fallback defaults when the
      # config block doesn't specify a value.  With a full
      # config.odf.storageCluster block (above), these are secondary:
      odf-ocs-storage-class-name: gp3-csi
      odf-ocs-storage-size: ''
      odf-ocs-storage-count: ''
      odf-ocs-storage-replicas: ''
      odf-resource-profile: lean
      odf-channel: stable-4.20
      odf-source: redhat-operators
      odf-source-namespace: openshift-marketplace
      ### Advanced Cluster Security
      acs: 'true'
      acs-subscription-name: rhacs-operator
      acs-version: 'rhacs-operator.v4.11.2'
      acs-channel: stable
      acs-source: redhat-operators
      acs-source-namespace: openshift-marketplace
      acs-monitoring: 'true'
      ### cert-manager
      cert-manager: 'true'
      cert-manager-subscription-name: openshift-cert-manager-operator
      cert-manager-channel: stable-v1
      cert-manager-source: redhat-operators
      cert-manager-source-namespace: openshift-marketplace
      cert-manager-ca: 'true'
      # cert-manager-api-cert: 'true'
      # cert-manager-ingress-cert: 'true'
      ### Ansible Automation Platform
      # aap: 'true'
      aap-subscription-name: ansible-automation-platform-operator
      aap-channel: stable-2.7
      aap-install-plan-approval: Automatic
      aap-source: redhat-operators
      aap-source-namespace: openshift-marketplace
      # aap-hub-disabled: 'false'
      # aap-storage-type: 's3'
      # aap-eda-disabled: 'false'
      # aap-lightspeed-disabled: 'true'
      ### Developer Spaces
      dev-spaces: 'false'
      dev-spaces-subscription-name: devspaces
      dev-spaces-channel: ''
      dev-spaces-source: redhat-operators
      dev-spaces-source-namespace: openshift-marketplace
      ### Developer Hub
      dev-hub: 'false'
      dev-hub-subscription-name: rhdh
      dev-hub-channel: fast-1.9
      dev-hub-source: ''
      dev-hub-source-namespace: ''
      ### OpenShift Pipelines
      pipelines: 'false'
      pipelines-subscription-name: openshift-pipelines-operator-rh
      pipelines-channel: pipelines-1.21
      pipelines-source: ''
      pipelines-source-namespace: ''
      ### Trusted Artifact Signer
      tas: 'false'
      tas-subscription-name: rhtas-operator
      tas-channel: ''
      tas-source: ''
      tas-source-namespace: ''
      ### Quay
      quay: 'false'
      quay-subscription-name: quay-operator
      quay-channel: stable-3.17
      quay-source: ''
      quay-source-namespace: ''
      ### Developer OpenShift Gitops
      # gitops-dev: 'true'
      gitops-dev-team-test: 'hub'
      ### Loki
      # loki: 'true'
      loki-subscription-name: loki-operator
      loki-channel: stable-6.5
      loki-source: redhat-operators
      loki-source-namespace: openshift-marketplace
      loki-size: 1x.extra-small
      loki-storageclass: gp3-csi
      loki-lokistack-name: logging-lokistack
      ### OpenShift Logging
      # logging: 'true'
      logging-subscription-name: cluster-logging
      logging-channel: stable-6.5
      logging-source: redhat-operators
      logging-source-namespace: openshift-marketplace
      ### Cluster Observability Operator
      # coo: 'true'
      coo-subscription-name: cluster-observability-operator
      coo-channel: stable
      coo-source: redhat-operators
      coo-source-namespace: openshift-marketplace
      ### User Workload Monitoring
      # uwm: 'true'
      ### Compliance Operator Stig Apply
      # compliance: 'true'
      # compliance-auto-remediate: 'true'
      compliance-subscription-name: compliance-operator
      compliance-source: redhat-operators
      compliance-source-namespace: openshift-marketplace
      compliance-channel: stable
      ### Disconnected Mirror Settings
      mirror-catalog-suffix: 'mirror'
      ### node-maintenance
      # node-maintenance: 'true'
      node-maintenance-subscription-name: node-maintenance-operator
      node-maintenance-channel: stable
      node-maintenance-source: redhat-operators
      node-maintenance-source-namespace: openshift-marketplace
      node-maintenance-version: 'node-maintenance-operator.v5.5.0'
      ### Kubernetes NMState Operator
      nmstate: 'true'
      nmstate-subscription-name: kubernetes-nmstate-operator
      nmstate-channel: stable
      nmstate-source: redhat-operators
      nmstate-source-namespace: openshift-marketplace
      ### OpenShift Virtualization
      virt: 'true'
      virt-subscription-name: kubevirt-hyperconverged
      virt-channel: stable
      virt-source: redhat-operators
      virt-source-namespace: openshift-marketplace
      ### external-secrets-operator
      # external-secrets-operator: 'true'
      external-secrets-operator-subscription-name: openshift-external-secrets-operator
      external-secrets-operator-channel: stable-v1
      external-secrets-operator-source: redhat-operators
      external-secrets-operator-source-namespace: openshift-marketplace
