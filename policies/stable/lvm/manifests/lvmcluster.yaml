object-templates-raw: |
  {{hub $cm := (lookup "v1" "ConfigMap" .PolicyMetadata.namespace (printf "%s.rendered-config" .ManagedClusterName)) hub}}
  {{hub- $config := (index ($cm.data | default dict) "config" | default "" | fromYaml) hub}}
  {{hub- $lvm := (index $config "lvm" | default dict) hub}}
  {{hub- $devicePaths := (index $lvm "devicePaths" | default list) hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: lvm.topolvm.io/v1alpha1
      kind: LVMCluster
      metadata:
        name: lvmcluster
        namespace: openshift-storage
      spec:
        storage:
          deviceClasses:
            - default: '{{hub index .ManagedClusterLabels "autoshift.io/lvm-default" | default "true" | toBool hub}}'
              fstype: '{{hub index .ManagedClusterLabels "autoshift.io/lvm-fstype" | default "xfs" hub}}'
              name: vg1
  {{hub- if (gt (len $devicePaths) 0) hub}}
              deviceSelector:
                paths:
  {{hub- range $path := $devicePaths hub}}
                  - {{hub $path hub}}
  {{hub- end hub}}
  {{hub- end hub}}
              thinPoolConfig:
                chunkSizeCalculationPolicy: Static
                metadataSizeCalculationPolicy: Host
                sizePercent: '{{hub index .ManagedClusterLabels "autoshift.io/lvm-size-percent" | default 90 | toInt hub}}'
                name: thin-pool-1
                overprovisionRatio: '{{hub index .ManagedClusterLabels "autoshift.io/lvm-overprovision-ratio" | default 10 | toInt hub}}'
