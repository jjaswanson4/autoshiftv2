object-templates-raw: |
  {{hub- $provIP := (index .ManagedClusterLabels "autoshift.io/acm-provisioning-ip" | default "") hub}}
  - complianceType: musthave
    objectDefinition:
      apiVersion: metal3.io/v1alpha1
      kind: Provisioning
      metadata:
        name: provisioning-configuration
      spec:
        provisioningNetwork: Disabled
        watchAllNamespaces: true
  {{hub- if $provIP hub}}
        # Ironic's TLS cert only gets an IP SAN when provisioningIP is set. BMCs fetch virtual-media
        # ISOs from https://<ip>:6183, so without it they reject the cert and the ISO never mounts.
        # With provisioningNetwork Disabled, metal3 does NOT add this IP to any interface: it must be
        # an address the node already has (on SNO, the node IP).
        provisioningIP: '{{hub $provIP hub}}'
  {{hub- end hub}}
